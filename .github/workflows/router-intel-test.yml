name: Intel soft-router test
on:
  push:
    branches: [notion/soft-router]
    tags: ['intel-v1.9.1-router-test.1']
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15-intel
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: '1.9.1'
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax, sums and architecture
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          shasum -a 256 -c SHA256SUMS
          bash -n core/claude-switch.sh soft-router/安装.command scripts/package-macos.sh
      - name: Regression suite
        run: python3 -B -m unittest discover -s tests -v
      - name: Build app and special installer
        run: |
          set -euo pipefail
          bash scripts/package-macos.sh "$VERSION"
          APP='build/Claude切换器.app'
          lipo "$APP/Contents/MacOS/ClaudeSwitcher" -verify_arch x86_64
          test "$(lipo -archs "$APP/Contents/MacOS/ClaudeSwitcher")" = x86_64
          codesign --verify --deep --strict "$APP"
          mkdir -p build/router-kit
          ditto "$APP" 'build/router-kit/Claude切换器.app'
          cp soft-router/安装.command soft-router/说明.txt build/router-kit/
          cp core/claude-switch.sh core/stun-probe.py LICENSE build/router-kit/
          chmod +x build/router-kit/安装.command
          ditto -c -k --keepParent --norsrc --noextattr build/router-kit build/ClaudeSwitcher-1.9.1-intel-soft-router.zip
          temp=$(mktemp -d); trap 'rm -rf "$temp"' EXIT
          ditto -x -k build/ClaudeSwitcher-1.9.1-intel-soft-router.zip "$temp"
          test -x "$temp/router-kit/安装.command"
          bash -n "$temp/router-kit/安装.command" "$temp/router-kit/claude-switch.sh"
          lipo "$temp/router-kit/Claude切换器.app/Contents/MacOS/ClaudeSwitcher" -verify_arch x86_64
          codesign --verify --deep --strict "$temp/router-kit/Claude切换器.app"
          (cd build && shasum -a 256 ClaudeSwitcher-1.9.1-intel-soft-router.zip > SHA256SUMS-router.txt && shasum -a 256 -c SHA256SUMS-router.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: intel-soft-router-test
          path: |
            build/ClaudeSwitcher-1.9.1-intel-soft-router.zip
            build/SHA256SUMS-router.txt
          if-no-files-found: error
      - name: Publish fork prerelease
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            build/ClaudeSwitcher-1.9.1-intel-soft-router.zip build/SHA256SUMS-router.txt \
            --prerelease --title 'Intel 软路由适配测试版' \
            --notes '个人 fork 测试版，未在 Intel macOS 26 真机验收。无故障断网保护；不安装 root 保镖，不修改路由器与系统网络配置。账号切换前的检查不保证流量不泄漏。应用为 ad-hoc 签名，未公证。源码和许可证参见此 release 对应标签。'
